# PriceAction AI public API (OpenAPI 3.1).
# Source: docs/architecture/04_API_SPECIFICATION.md (ARC-04). Every ARC-04 endpoint id is carried in x-arc04-id.
# From M1 this file is the machine-readable contract: change ARC-04 and this file together (CLAUDE.md §9).
openapi: "3.1.0"
info:
  title: "PriceAction AI public API"
  version: "0.2.0"
  summary: "REST API v1 served by Laravel under /api/v1."
  description: "Machine-readable source of the public API (ARC-04, docs/architecture/04_API_SPECIFICATION.md). Authentication is Laravel Sanctum SPA cookie auth with CSRF. Tenant context comes from the session; clients never send a tenant id, and another tenant's resource id returns 404. Prices and money are decimal strings. Responses carry meta.data_mode and meta.as_of whenever they contain market data or analysis, and the UI must badge DEMO as sample data. There is deliberately no endpoint that places, changes or cancels broker orders (ADR-010)."
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Proprietary"
servers:
  - url: "/"
    description: "Same origin. The frontend proxies /api/* and /sanctum/* to Laravel."
tags:
  - name: "Auth"
    description: "Registration, login, password reset, email verification (ARC-04 §4)."
  - name: "Account"
    description: "Profile and account (ARC-04 §4)."
  - name: "Onboarding"
    description: "Onboarding steps (ARC-04 §5)."
  - name: "Preferences"
    description: "Trading preferences and risk profile (ARC-04 §5)."
  - name: "DataSources"
    description: "Data sources and entitlements (ARC-04 §5)."
  - name: "Market"
    description: "Instruments, universes, candles, sessions, ingestion (ARC-04 §6)."
  - name: "Scanner"
    description: "Scanner, dashboard, activity (ARC-04 §7)."
  - name: "Analysis"
    description: "Analysis runs, setups, rulesets (ARC-04 §7)."
  - name: "Explanations"
    description: "LLM explanations and Q&A; explanation-only (ARC-04 §7, ADR-009)."
  - name: "Jobs"
    description: "Asynchronous job status (ARC-04 §7)."
  - name: "Risk"
    description: "Stateless risk calculation (ARC-04 §8.1)."
  - name: "TradePlans"
    description: "Proposed trade plans (ARC-04 §8.2)."
  - name: "Watchlists"
    description: "Watchlists (ARC-04 §9)."
  - name: "Paper"
    description: "Paper account and trades (ARC-04 §10)."
  - name: "ActualTrades"
    description: "Actual trades the user recorded (ARC-04 §10)."
  - name: "Portfolio"
    description: "Portfolio per book (ARC-04 §10)."
  - name: "Journal"
    description: "Trading journal (ARC-04 §11)."
  - name: "Backtests"
    description: "Backtesting (ARC-04 §12)."
  - name: "Zerodha"
    description: "Zerodha Kite connection (ARC-04 §13)."
  - name: "Notifications"
    description: "In-app notifications (ARC-04 §14)."
paths:
  "/sanctum/csrf-cookie":
    get:
      operationId: "getCsrfCookie"
      tags:
        - "Auth"
      summary: "Issue the XSRF-TOKEN cookie"
      x-arc04-id: "A1"
      security: []
      responses:
        "204":
          description: "Sets the XSRF-TOKEN cookie."
          headers:
            Set-Cookie:
              schema:
                type: "string"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/register":
    post:
      operationId: "register"
      tags:
        - "Auth"
      summary: "Register"
      x-arc04-id: "A2"
      description: "Domain codes: EMAIL_TAKEN, PASSWORD_WEAK. Rate bucket: auth."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      security:
        - csrfToken: []
      responses:
        "201":
          description: "Account created, session started, verification email sent."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/AuthSession"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/login":
    post:
      operationId: "login"
      tags:
        - "Auth"
      summary: "Log in"
      x-arc04-id: "A3"
      description: "422 INVALID_CREDENTIALS is generic (no user enumeration). 423 ACCOUNT_SUSPENDED. Rate bucket: auth."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      security:
        - csrfToken: []
      responses:
        "200":
          description: "Logged in."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/AuthSession"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/logout":
    post:
      operationId: "logout"
      tags:
        - "Auth"
      summary: "Log out"
      x-arc04-id: "A4"
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: "Session invalidated and token regenerated."
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/forgot-password":
    post:
      operationId: "forgotPassword"
      tags:
        - "Auth"
      summary: "Request a password reset"
      x-arc04-id: "A5"
      description: "Rate bucket: auth."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ForgotPasswordRequest"
      security:
        - csrfToken: []
      responses:
        "202":
          description: "Always 202 (no enumeration)."
        "400":
          "$ref": "#/components/responses/BadRequest"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/reset-password":
    post:
      operationId: "resetPassword"
      tags:
        - "Auth"
      summary: "Reset password"
      x-arc04-id: "A6"
      description: "422 RESET_TOKEN_INVALID. Rate bucket: auth."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ResetPasswordRequest"
      security:
        - csrfToken: []
      responses:
        "204":
          description: "Password reset; all other sessions revoked."
        "400":
          "$ref": "#/components/responses/BadRequest"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/email/verification-notification":
    post:
      operationId: "resendVerification"
      tags:
        - "Auth"
      summary: "Resend the verification email"
      x-arc04-id: "A7"
      description: "Unverified users may call this endpoint. Rate bucket: 3/hour."
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "202":
          description: "Accepted."
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/email/verify/{id}/{hash}":
    get:
      operationId: "verifyEmail"
      tags:
        - "Auth"
      summary: "Verify email (signed URL)"
      x-arc04-id: "A8"
      description: "Signed URL. 403 INVALID_SIGNATURE."
      parameters:
        - "$ref": "#/components/parameters/IdPath"
        - name: "hash"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "signature"
          in: "query"
          schema:
            type: "string"
          description: "Signature of the signed URL."
          required: true
        - name: "expires"
          in: "query"
          schema:
            type: "integer"
          description: "Expiry of the signed URL."
      security: []
      responses:
        "302":
          description: "Redirect to /onboarding or /dashboard."
          headers:
            Location:
              schema:
                type: "string"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/me":
    get:
      operationId: "getMe"
      tags:
        - "Account"
      summary: "Current user, tenant, entitlement and data source"
      x-arc04-id: "A9"
      description: "Unverified users may call this endpoint."
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Current account."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/Me"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
    delete:
      operationId: "deleteAccount"
      tags:
        - "Account"
      summary: "Schedule account deletion"
      x-arc04-id: "A12"
      description: "OWNER only."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DeleteAccountRequest"
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "202":
          description: "Scheduled for deletion in 30 days; provider tokens revoked immediately."
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/me/profile":
    patch:
      operationId: "updateProfile"
      tags:
        - "Account"
      summary: "Update profile"
      x-arc04-id: "A10"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ProfilePatch"
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: "Updated."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    properties:
                      user:
                        "$ref": "#/components/schemas/UserSummary"
                    required:
                      - "user"
                    additionalProperties: false
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/me/password":
    put:
      operationId: "changePassword"
      tags:
        - "Account"
      summary: "Change password"
      x-arc04-id: "A11"
      description: "422 INVALID_CURRENT_PASSWORD."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ChangePasswordRequest"
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: "Password changed; other sessions revoked."
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/onboarding":
    get:
      operationId: "getOnboarding"
      tags:
        - "Onboarding"
      summary: "Onboarding state"
      x-arc04-id: "O1"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "State."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/OnboardingState"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/onboarding/steps/{step}":
    put:
      operationId: "saveOnboardingStep"
      tags:
        - "Onboarding"
      summary: "Save an onboarding step"
      x-arc04-id: "O2"
      description: "409 STEP_OUT_OF_ORDER only if a required earlier step is missing."
      parameters:
        - "$ref": "#/components/parameters/StepPath"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OnboardingStepPayload"
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: "State."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/OnboardingState"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/onboarding/steps/{step}/skip":
    post:
      operationId: "skipOnboardingStep"
      tags:
        - "Onboarding"
      summary: "Skip an optional step"
      x-arc04-id: "O3"
      description: "422 STEP_NOT_SKIPPABLE for required steps."
      parameters:
        - "$ref": "#/components/parameters/StepPath"
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: "State."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/OnboardingState"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/onboarding/complete":
    post:
      operationId: "completeOnboarding"
      tags:
        - "Onboarding"
      summary: "Complete onboarding"
      x-arc04-id: "O4"
      description: "422 ONBOARDING_INCOMPLETE lists required steps."
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: "State COMPLETED."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/OnboardingState"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/preferences/trading":
    get:
      operationId: "getTradingPreferences"
      tags:
        - "Preferences"
      summary: "Trading preferences"
      x-arc04-id: "P1"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Preferences."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/TradingPreferences"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
    put:
      operationId: "putTradingPreferences"
      tags:
        - "Preferences"
      summary: "Replace trading preferences"
      x-arc04-id: "P2"
      description: "422 TIMEFRAME_NOT_SUPPORTED unless default_timeframe is 1D."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TradingPreferences"
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: "Saved."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/TradingPreferences"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/risk-profile":
    get:
      operationId: "getRiskProfile"
      tags:
        - "Preferences"
      summary: "Current risk profile and ruleset bounds"
      x-arc04-id: "P3"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Risk profile."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/RiskProfileRead"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
    put:
      operationId: "putRiskProfile"
      tags:
        - "Preferences"
      summary: "Create a new risk-profile version"
      x-arc04-id: "P4"
      description: "Ranges from TRD-01 §6. 422 MIN_RR_BELOW_RULESET when min_rr is below the ruleset; max_entry_gap_pct must not exceed the ruleset."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RiskProfile"
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "201":
          description: "New version."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/RiskProfile"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/data-sources":
    get:
      operationId: "listDataSources"
      tags:
        - "DataSources"
      summary: "Selectable data sources"
      x-arc04-id: "P5"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Global entitled sources plus the tenant's own personal sources."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/DataSource"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/data-source-selection":
    put:
      operationId: "selectDataSource"
      tags:
        - "DataSources"
      summary: "Select the data source"
      x-arc04-id: "P6"
      description: "OWNER or ADMIN. 403 ENTITLEMENT_REQUIRED; 404 for another tenant's source; 422 DATA_SOURCE_NOT_READY."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                data_source_id:
                  type: "string"
                  format: "uuid"
              required:
                - "data_source_id"
              additionalProperties: false
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: "Selected."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/DataSourceSummary"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/entitlements":
    get:
      operationId: "getEntitlements"
      tags:
        - "DataSources"
