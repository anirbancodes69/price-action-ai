            invested:
              "$ref": "#/components/schemas/Money"
            cash:
              "$ref": "#/components/schemas/Money"
            unrealized_pnl:
              "$ref": "#/components/schemas/Money"
            realized_pnl:
              "$ref": "#/components/schemas/Money"
            open_risk:
              "$ref": "#/components/schemas/Money"
            max_risk_per_trade_pct:
              "$ref": "#/components/schemas/Ratio"
          required:
