          in: "query"
          schema:
            "$ref": "#/components/schemas/StructureState"
        - name: "signal"
          in: "query"
          schema:
            "$ref": "#/components/schemas/SignalState"
        - name: "setup_type"
          in: "query"
          schema:
            "$ref": "#/components/schemas/SetupType"
        - name: "setup_status"
          in: "query"
          schema:
            "$ref": "#/components/schemas/SetupStatus"
        - name: "direction"
          in: "query"
          schema:
            "$ref": "#/components/schemas/Direction"
        - name: "min_rr"
          in: "query"
          schema:
            "$ref": "#/components/schemas/Ratio"
        - name: "min_score"
          in: "query"
          schema:
            type: "integer"
            minimum: 0
            maximum: 100
        - name: "near"
          in: "query"
          schema:
            type: "string"
            enum:
              - "SUPPORT"
              - "RESISTANCE"
        - name: "sort"
          in: "query"
          schema:
            type: "string"
          description: "Allow-listed field; prefix - for descending, e.g. -quality_score."
        - "$ref": "#/components/parameters/Limit"
        - "$ref": "#/components/parameters/Cursor"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Rows from a live analysis of the universe. meta also carries total, ruleset and notice (decision support only)."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/ScannerRow"
                  meta:
                    "$ref": "#/components/schemas/MarketMeta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "502":
