      description: "Served live from the engine (ADR-016): every request analyses the universe on the latest closed bars. 503 ENGINE_UNAVAILABLE when the engine is down, 409 NO_DATA_SOURCE / RULESET_UNAVAILABLE for configuration problems. `near` and `watchlist` are not available in live mode and are rejected with 422."
      parameters:
        - name: "universe"
          in: "query"
          schema:
            "$ref": "#/components/schemas/UniverseCode"
        - name: "watchlist"
          in: "query"
          schema:
            type: "string"
            format: "uuid"
          description: "Not available in live mode (ADR-016): rejected with 422."
        - name: "q"
          in: "query"
          schema:
            type: "string"
        - name: "htf_state"
          in: "query"
          schema:
            "$ref": "#/components/schemas/StructureState"
          description: "15m context."
