      responses:
        "202":
          description: "Cancellation requested."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/Backtest"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/integrations/zerodha/connect":
    post:
      operationId: "connectZerodha"
      tags:
        - "Zerodha"
      summary: "Start the Kite login"
      x-arc04-id: "I1"
      description: "OWNER. 403 ENTITLEMENT_REQUIRED; 503 PROVIDER_NOT_CONFIGURED. Rate bucket: integration."
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: "Kite login URL with api_key and a signed state."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/ZerodhaConnectUrl"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "503":
          "$ref": "#/components/responses/Unavailable"
  "/api/v1/integrations/zerodha/callback":
    get:
      operationId: "zerodhaCallback"
      tags:
        - "Zerodha"
      summary: "Kite redirect target"
      x-arc04-id: "I2"
      description: "Browser redirect. The request_token is exchanged server-side and never stored. Errors: STATE_MISMATCH, PROVIDER_AUTH_FAILED."
      parameters:
        - name: "request_token"
          in: "query"
          schema:
            type: "string"
          required: true
        - name: "status"
          in: "query"
          schema:
            type: "string"
          required: true
        - name: "state"
          in: "query"
          schema:
            type: "string"
          description: "Signed state, validated against the stored hash."
          required: true
      security:
        - sessionCookie: []
      responses:
        "302":
          description: "Redirect to /settings?section=broker&result=connected or result=error&code=..."
          headers:
            Location:
              schema:
                type: "string"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/integrations/zerodha":
    get:
      operationId: "getZerodhaStatus"
      tags:
        - "Zerodha"
      summary: "Connection status"
      x-arc04-id: "I3"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Status (never tokens)."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    "$ref": "#/components/schemas/ZerodhaStatus"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
    delete:
      operationId: "disconnectZerodha"
      tags:
        - "Zerodha"
      summary: "Disconnect Kite"
      x-arc04-id: "I4"
      description: "OWNER."
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: "Token deleted (and invalidated at the provider where supported); personal data source disabled."
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/notifications":
    get:
      operationId: "listNotifications"
      tags:
        - "Notifications"
      summary: "Notifications"
      x-arc04-id: "Z1"
      parameters:
        - name: "unread"
          in: "query"
          schema:
            type: "boolean"
        - "$ref": "#/components/parameters/Limit"
        - "$ref": "#/components/parameters/Cursor"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Page of notifications. meta.unread_count is set."
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Notification"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/ValidationFailed"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/notifications/{id}/read":
    post:
      operationId: "markNotificationRead"
      tags:
        - "Notifications"
      summary: "Mark one read"
      x-arc04-id: "Z2"
      parameters:
        - "$ref": "#/components/parameters/IdPath"
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: "No content."
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/notifications/read-all":
    post:
      operationId: "markAllNotificationsRead"
      tags:
        - "Notifications"
      summary: "Mark all read"
      x-arc04-id: "Z3"
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: "No content."
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "419":
          "$ref": "#/components/responses/CsrfMismatch"
        "429":
          "$ref": "#/components/responses/RateLimited"
components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "laravel_session"
      description: "Laravel Sanctum SPA session cookie (HttpOnly, Secure, SameSite=Lax). Obtain it through POST /api/v1/auth/login after GET /sanctum/csrf-cookie."
    csrfToken:
      type: "apiKey"
      in: "header"
      name: "X-XSRF-TOKEN"
      description: "Value of the XSRF-TOKEN cookie set by GET /sanctum/csrf-cookie. Required on every mutating request (419 CSRF_TOKEN_MISMATCH otherwise)."
  parameters:
    Limit:
      name: "limit"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 25
      description: "Page size (max 100)."
    Cursor:
      name: "cursor"
      in: "query"
      schema:
        type: "string"
      description: "Opaque cursor from meta.next_cursor."
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        format: "uuid"
      description: "Same key and body within 24 h returns the original response; same key with a different body returns 409 IDEMPOTENCY_KEY_REUSED."
    IdPath:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    SymbolPath:
      name: "symbol"
      in: "path"
      required: true
      schema:
        type: "string"
      description: "NSE trading symbol, e.g. RELIANCE."
    UniverseCodePath:
      name: "code"
      in: "path"
      required: true
      schema:
        "$ref": "#/components/schemas/UniverseCode"
    StepPath:
      name: "step"
      in: "path"
      required: true
      schema:
        type: "string"
        enum:
          - "welcome"
          - "experience"
          - "style"
          - "universe"
          - "data_source"
          - "risk"
    AsOf:
      name: "as_of"
      in: "query"
      schema:
        type: "string"
        format: "date"
      description: "Exchange date, YYYY-MM-DD."
    AsOfTs:
      name: "as_of"
      in: "query"
      schema:
        type: "string"
        format: "date-time"
      description: "A 5m bar close (ISO-8601 with +05:30); default the latest."
    BookRequired:
      name: "book"
      in: "query"
      required: true
      schema:
        "$ref": "#/components/schemas/Book"
      description: "Required. Books are never mixed."
  responses:
    BadRequest:
      description: "400 BAD_REQUEST: malformed JSON."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: "401 UNAUTHENTICATED: no or expired session."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: "403 FORBIDDEN, EMAIL_NOT_VERIFIED or ENTITLEMENT_REQUIRED."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: "404 NOT_FOUND: missing, or another tenant's resource (never 403, to avoid enumeration)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: "409 CONFLICT, STALE_VERSION or a domain state conflict."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    CsrfMismatch:
      description: "419 CSRF_TOKEN_MISMATCH."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: "422 VALIDATION_FAILED or a domain code (e.g. STOP_NOT_BELOW_ENTRY)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: "429 RATE_LIMITED or QUOTA_EXCEEDED."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
      headers:
        Retry-After:
          description: "Seconds to wait before retrying."
          schema:
            type: "integer"
        X-RateLimit-Limit:
          schema:
            type: "integer"
        X-RateLimit-Remaining:
          schema:
            type: "integer"
    EngineContractError:
      description: "502 ENGINE_CONTRACT_ERROR: the engine returned an unexpected payload."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: "503 ENGINE_UNAVAILABLE, PROVIDER_UNAVAILABLE or PROVIDER_NOT_CONFIGURED."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
      headers:
        Retry-After:
          description: "Seconds to wait before retrying."
          schema:
            type: "integer"
  schemas:
    ActivityItem:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        kind:
          type: "string"
          enum:
            - "SETUP"
            - "PLAN"
            - "TRIGGER"
            - "INVALIDATED"
            - "JOURNAL"
            - "WATCHLIST"
        title:
          type: "string"
        detail:
          type: "string"
        at:
          type: "string"
          format: "date-time"
          description: "ISO-8601 timestamp with offset."
        entity:
          type: "object"
          description: "Reference to the related entity."
          additionalProperties: true
      required:
        - "id"
        - "kind"
        - "title"
        - "detail"
        - "at"
        - "entity"
      additionalProperties: false
    ActualTrade:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        instrument:
          "$ref": "#/components/schemas/Instrument"
        trade_plan_id:
          oneOf:
            - type: "string"
              format: "uuid"
            - type: "null"
        status:
          type: "string"
          enum:
            - "OPEN"
            - "CLOSED"
        stop:
          oneOf:
            - "$ref": "#/components/schemas/Price"
            - type: "null"
          description: "The owner's stop for this trade; null when none was entered."
        target:
          oneOf:
            - "$ref": "#/components/schemas/Price"
            - type: "null"
          description: "The owner's target for this trade; null when none was entered."
        quantity_open:
          type: "integer"
          minimum: 0
        avg_entry_price:
          oneOf:
            - "$ref": "#/components/schemas/Price"
            - type: "null"
        avg_exit_price:
          oneOf:
            - "$ref": "#/components/schemas/Price"
            - type: "null"
        realized_pnl:
          oneOf:
            - "$ref": "#/components/schemas/Money"
            - type: "null"
        charges:
          oneOf:
            - "$ref": "#/components/schemas/Money"
            - type: "null"
        fills:
          type: "array"
          items:
            "$ref": "#/components/schemas/Fill"
      required:
        - "id"
        - "instrument"
        - "trade_plan_id"
        - "status"
        - "stop"
        - "target"
        - "quantity_open"
        - "avg_entry_price"
        - "avg_exit_price"
        - "realized_pnl"
        - "charges"
        - "fills"
      additionalProperties: false
    ActualTradeCreate:
      type: "object"
      properties:
        instrument:
          type: "string"
          description: "Trading symbol."
        trade_plan_id:
          type: "string"
          format: "uuid"
        fill:
          type: "object"
          properties:
            side:
              type: "string"
              enum:
                - "BUY"
            quantity:
              type: "integer"
              minimum: 1
            price:
              "$ref": "#/components/schemas/Price"
            executed_at:
              type: "string"
              format: "date-time"
              description: "ISO-8601 timestamp with offset."
            broker_order_id:
              type: "string"
            fees:
              "$ref": "#/components/schemas/Money"
          required:
            - "side"
            - "quantity"
            - "price"
            - "executed_at"
          additionalProperties: false
        stop:
          "$ref": "#/components/schemas/Price"
          description: "Optional; must be below the fill price. Counts as the trade's open risk in the account limits."
        target:
          "$ref": "#/components/schemas/Price"
          description: "Optional; must be above the fill price."
        notes:
          type: "string"
      required:
        - "instrument"
        - "fill"
      additionalProperties: false
    AnalysisRun:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        instrument:
          "$ref": "#/components/schemas/Instrument"
        as_of:
          type: "string"
          description: "End of the last completed 5m bar used."
          format: "date-time"
        status:
          "$ref": "#/components/schemas/RunStatus"
        timeframe:
          type: "string"
          enum:
            - "5m"
        ruleset:
          type: "object"
          properties:
            code:
              type: "string"
            version:
              type: "string"
            validation_status:
              type: "string"
              enum:
                - "HYPOTHESIS"
                - "VALIDATED"
          required:
            - "code"
            - "version"
            - "validation_status"
          additionalProperties: false
        engine_version:
          type: "string"
        inputs:
          type: "array"
          items:
            type: "object"
            properties:
              role:
                type: "string"
                enum:
                  - "PRIMARY_5M"
                  - "CONTEXT_15M"
                  - "DAILY_CONTEXT"
              candle_snapshot_id:
                type: "string"
                format: "uuid"
            required:
              - "role"
              - "candle_snapshot_id"
            additionalProperties: false
          description: "Candle snapshots the run read; empty in live mode (ADR-016: nothing is persisted)."
        context:
          type: "object"
          properties:
            htf_state:
              oneOf:
                - "$ref": "#/components/schemas/StructureState"
                - type: "null"
            htf_transition_direction:
              oneOf:
                - type: "string"
                  enum:
                    - "UP"
                    - "DOWN"
                - type: "null"
            session:
              "$ref": "#/components/schemas/SessionLevels"
          required:
            - "htf_state"
            - "htf_transition_direction"
            - "session"
          description: "15m context aligned to the 5m close without look-ahead (TRD-02 §9)."
          additionalProperties: false
        structure:
          "$ref": "#/components/schemas/StructureSummary"
        signal:
          type: "object"
          properties:
            state:
              "$ref": "#/components/schemas/SignalState"
            reason_codes:
              type: "array"
              items:
                type: "string"
            signal_at:
              oneOf:
                - type: "string"
                  format: "date-time"
                  description: "ISO-8601 timestamp with offset."
                - type: "null"
            valid_until:
              oneOf:
                - type: "string"
                  format: "date-time"
                  description: "ISO-8601 timestamp with offset."
                - type: "null"
          required:
            - "state"
            - "reason_codes"
            - "signal_at"
            - "valid_until"
          additionalProperties: false
        primary_setup_id:
          oneOf:
            - type: "string"
              format: "uuid"
            - type: "null"
        setups:
          type: "array"
          items:
            "$ref": "#/components/schemas/Setup"
        swings:
          type: "array"
          items:
            "$ref": "#/components/schemas/SwingPoint"
        events:
          type: "array"
          items:
            "$ref": "#/components/schemas/StructureEvent"
        zones:
          type: "array"
          items:
            "$ref": "#/components/schemas/Zone"
        liquidity:
          type: "array"
          items:
            "$ref": "#/components/schemas/LiquidityEvent"
          description: "Empty in live mode (ADR-016): equal-level pools are not itemised with their bars."
        candles:
          type: "array"
          items:
            "$ref": "#/components/schemas/Candle"
          description: "Present only when ?include=candles."
        candles_15m:
          type: "array"
          items:
            "$ref": "#/components/schemas/Candle"
          description: "Present only when ?include=candles_15m."
        candles_1d:
          type: "array"
          items:
            "$ref": "#/components/schemas/Candle"
          description: "Present only when ?include=candles_1d."
      required:
        - "id"
        - "instrument"
        - "as_of"
        - "status"
        - "timeframe"
        - "ruleset"
        - "engine_version"
        - "inputs"
        - "context"
        - "structure"
        - "signal"
        - "primary_setup_id"
        - "setups"
        - "swings"
        - "events"
        - "zones"
        - "liquidity"
      description: "Immutable analysis of one instrument at one 5m bar close (ADR-015)."
      additionalProperties: false
    AuthSession:
      type: "object"
      properties:
        user:
          "$ref": "#/components/schemas/UserSummary"
        tenant:
          "$ref": "#/components/schemas/TenantSummary"
        onboarding:
          "$ref": "#/components/schemas/OnboardingSummary"
      required:
        - "user"
      description: "Personal mode returns only `user`; onboarding and tenant are deferred (ADR-014)."
      additionalProperties: false
    Backtest:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          "$ref": "#/components/schemas/BacktestStatus"
        progress_pct:
          type: "integer"
          minimum: 0
          maximum: 100
        config:
          "$ref": "#/components/schemas/BacktestConfig"
        ruleset_version:
          type: "string"
        engine_version:
          type: "string"
        cost_schedule_version:
          oneOf:
            - type: "string"
            - type: "null"
        metrics:
          oneOf:
            - type: "object"
              description: "Full metrics (TRD-06)."
              additionalProperties: true
            - type: "null"
        equity_curve:
          oneOf:
            - type: "array"
              items:
                type: "object"
                properties:
                  date:
                    type: "string"
                    format: "date"
                    description: "Exchange date, YYYY-MM-DD."
                  equity:
                    "$ref": "#/components/schemas/Money"
                required:
                  - "date"
                  - "equity"
                additionalProperties: false
            - type: "null"
        flags:
          type: "array"
          items:
            type: "string"
        error_code:
          oneOf:
            - type: "string"
