          oneOf:
            - type: "string"
              format: "uuid"
            - type: "null"
        ruleset_version:
          type: "string"
        triggered_at:
          oneOf:
            - type: "string"
              format: "date-time"
              description: "ISO-8601 timestamp with offset."
            - type: "null"
        valid_until:
          oneOf:
            - type: "string"
              format: "date-time"
              description: "ISO-8601 timestamp with offset."
            - type: "null"
        created_at:
          type: "string"
          format: "date-time"
          description: "ISO-8601 timestamp with offset."
        updated_at:
          type: "string"
          format: "date-time"
          description: "ISO-8601 timestamp with offset."
        lock_version:
          type: "integer"
          description: "Optimistic-lock version; send it back on PATCH."
          minimum: 0
        linked:
          type: "object"
          properties:
            paper_trade_id:
              oneOf:
                - type: "string"
                  format: "uuid"
                - type: "null"
            actual_trade_ids:
              type: "array"
              items:
                type: "string"
                format: "uuid"
          required:
            - "paper_trade_id"
            - "actual_trade_ids"
          additionalProperties: false
      required:
        - "id"
        - "plan_number"
        - "instrument"
        - "status"
        - "status_reason"
        - "source"
        - "direction"
        - "entry"
        - "stop"
        - "target"
        - "engine_levels"
        - "levels_overridden"
        - "quantity"
        - "risk_budget"
        - "risk_amount"
        - "position_value"
        - "rr"
        - "binding_constraint"
        - "paper_tracking"
        - "note"
        - "analysis_run_id"
        - "setup_id"
        - "ruleset_version"
        - "triggered_at"
        - "valid_until"
        - "created_at"
        - "updated_at"
        - "lock_version"
        - "linked"
