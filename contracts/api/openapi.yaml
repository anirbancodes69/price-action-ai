    TradePlanCreate:
      type: "object"
      properties:
        analysis_run_id:
          type: "string"
          format: "uuid"
        setup_id:
          type: "string"
          format: "uuid"
        instrument:
          type: "string"
          description: "Trading symbol."
        entry:
          "$ref": "#/components/schemas/Price"
        stop:
          "$ref": "#/components/schemas/Price"
        target:
          "$ref": "#/components/schemas/Price"
        risk_per_trade_pct:
          "$ref": "#/components/schemas/Ratio"
        paper_tracking:
          type: "boolean"
        note:
          type: "string"
      required:
        - "analysis_run_id"
        - "instrument"
      description: "Levels default to the setup's engine levels. A manual plan needs all three levels and no setup_id. A client-supplied quantity is not accepted."
      additionalProperties: false
    TradePlanDetail:
      allOf:
        - "$ref": "#/components/schemas/TradePlan"
        - type: "object"
          properties:
            events:
              type: "array"
              items:
                type: "object"
                description: "Audit-log subset for this plan."
                additionalProperties: true
          required:
            - "events"
          additionalProperties: true
    TradePlanPatch:
      type: "object"
      properties:
        lock_version:
          type: "integer"
          minimum: 0
        entry:
          "$ref": "#/components/schemas/Price"
        stop:
          "$ref": "#/components/schemas/Price"
        target:
          "$ref": "#/components/schemas/Price"
        note:
          type: "string"
        paper_tracking:
          type: "boolean"
      required:
        - "lock_version"
      additionalProperties: false
    TradePlanStatus:
      type: "string"
      enum:
        - "PENDING"
        - "TRIGGERED"
        - "FILLED"
        - "SKIPPED"
        - "INVALIDATED"
        - "EXPIRED"
        - "CANCELLED"
    TradingPreferences:
      type: "object"
      properties:
        trading_styles:
          type: "array"
          items:
            "$ref": "#/components/schemas/TradingStyle"
        default_timeframe:
          type: "string"
          enum:
            - "1D"
          description: "Only 1D in MVP (TIMEFRAME_NOT_SUPPORTED otherwise)."
        universe_code:
          oneOf:
            - "$ref": "#/components/schemas/UniverseCode"
            - type: "null"
        direction_preference:
          type: "string"
          enum:
            - "LONG_ONLY"
            - "LONG_AND_REFERENCE"
        notification_settings:
          type: "object"
          description: "Per-notification-type toggles."
          additionalProperties: true
      required:
        - "trading_styles"
        - "default_timeframe"
        - "universe_code"
        - "direction_preference"
        - "notification_settings"
      additionalProperties: false
    TradingStyle:
      type: "string"
      enum:
        - "SWING"
        - "POSITIONAL"
        - "BREAKOUT"
        - "PULLBACK"
    Universe:
      type: "object"
      properties:
        code:
          "$ref": "#/components/schemas/UniverseCode"
        name:
          type: "string"
        member_count:
          type: "integer"
          minimum: 0
        is_demo:
          type: "boolean"
      required:
        - "code"
        - "name"
        - "member_count"
        - "is_demo"
      additionalProperties: false
    UniverseCode:
      type: "string"
      enum:
        - "NIFTY500"
        - "NIFTY50"
        - "NIFTY100"
        - "NIFTY200"
        - "NIFTYMIDCAP150"
        - "DEMO"
    UserSummary:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
        email_verified:
          type: "boolean"
        display_name:
          oneOf:
            - type: "string"
            - type: "null"
        experience_level:
          oneOf:
            - "$ref": "#/components/schemas/ExperienceLevel"
            - type: "null"
        timezone:
          oneOf:
            - type: "string"
              description: "IANA timezone."
            - type: "null"
      required:
        - "id"
        - "email"
        - "email_verified"
        - "display_name"
        - "experience_level"
        - "timezone"
      additionalProperties: false
    Watchlist:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          minLength: 1
          maxLength: 60
        sort_order:
          type: "integer"
        items:
          type: "array"
          items:
            type: "object"
            properties:
              symbol:
                type: "string"
              added_at:
                type: "string"
                format: "date-time"
                description: "ISO-8601 timestamp with offset."
            required:
              - "symbol"
              - "added_at"
            additionalProperties: false
          maxItems: 200
      required:
        - "id"
        - "name"
        - "sort_order"
        - "items"
      additionalProperties: false
    WatchlistCreate:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 60
        id:
          type: "string"
          format: "uuid"
          description: "Optional client-generated id, so a retried request cannot create the list twice."
      required:
        - "name"
      additionalProperties: false
    WatchlistPatch:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 60
        sort_order:
          type: "integer"
      additionalProperties: false
    ZerodhaConnectUrl:
      type: "object"
      properties:
        login_url:
          type: "string"
          format: "uri"
      required:
        - "login_url"
      additionalProperties: false
    ZerodhaStatus:
      type: "object"
      properties:
        status:
          type: "string"
        provider_user_id_masked:
          oneOf:
            - type: "string"
            - type: "null"
        token_expires_at:
          oneOf:
            - type: "string"
              format: "date-time"
              description: "ISO-8601 timestamp with offset."
            - type: "null"
        last_connected_at:
          oneOf:
            - type: "string"
              format: "date-time"
              description: "ISO-8601 timestamp with offset."
            - type: "null"
        last_error_code:
          oneOf:
            - type: "string"
            - type: "null"
        data_source_id:
          oneOf:
            - type: "string"
              format: "uuid"
            - type: "null"
      required:
        - "status"
        - "provider_user_id_masked"
        - "token_expires_at"
        - "last_connected_at"
        - "last_error_code"
        - "data_source_id"
      description: "Never contains tokens (ARC-06)."
      additionalProperties: false
    Zone:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        role:
          type: "string"
          enum:
            - "SUPPORT"
            - "RESISTANCE"
        low:
          "$ref": "#/components/schemas/Price"
        high:
          "$ref": "#/components/schemas/Price"
        touches:
          type: "integer"
          minimum: 0
        strength_score:
          type: "integer"
          minimum: 0
          maximum: 100
        strength_bucket:
          type: "string"
          enum:
            - "WEAK"
            - "MODERATE"
            - "STRONG"
        status:
          type: "string"
          enum:
            - "ACTIVE"
            - "BROKEN_FLIPPED"
            - "RETIRED"
        role_reversed:
          type: "boolean"
        formed_at:
          type: "string"
          format: "date-time"
          description: "ISO-8601 timestamp with offset."
        distance_pct:
          oneOf:
            - "$ref": "#/components/schemas/Ratio"
            - type: "null"
          description: "Null in live mode (ADR-016): the engine does not supply it."
      required:
        - "id"
        - "role"
        - "low"
        - "high"
        - "touches"
        - "strength_score"
        - "strength_bucket"
        - "status"
        - "role_reversed"
        - "formed_at"
        - "distance_pct"
      additionalProperties: false
    ZonesView:
      type: "object"
      properties:
        zones:
          type: "array"
          items:
            "$ref": "#/components/schemas/Zone"
        liquidity:
          type: "array"
          items:
            "$ref": "#/components/schemas/LiquidityEvent"
        nearest_support:
          oneOf:
            - "$ref": "#/components/schemas/Zone"
            - type: "null"
        nearest_resistance:
          oneOf:
            - "$ref": "#/components/schemas/Zone"
            - type: "null"
      required:
        - "zones"
        - "liquidity"
        - "nearest_support"
        - "nearest_resistance"
      additionalProperties: false
