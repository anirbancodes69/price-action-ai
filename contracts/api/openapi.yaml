        - "trade_plan_id"
        - "instrument"
        - "status"
        - "entry_at"
        - "entry_price"
        - "quantity"
        - "initial_stop"
        - "current_stop"
        - "target"
        - "exit_at"
        - "exit_price"
        - "exit_reason"
        - "gross_pnl"
        - "charges"
        - "net_pnl"
        - "r_multiple"
        - "signal"
      additionalProperties: false
    PaperTradeDetail:
      allOf:
