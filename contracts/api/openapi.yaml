            - "$ref": "#/components/schemas/Money"
            - type: "null"
        net_pnl:
          oneOf:
            - "$ref": "#/components/schemas/Money"
            - type: "null"
        r_multiple:
          oneOf:
            - "$ref": "#/components/schemas/Ratio"
            - type: "null"
        signal:
          oneOf:
            - "$ref": "#/components/schemas/SignalState"
            - type: "null"
      required:
