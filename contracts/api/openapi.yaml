          type: "string"
          format: "uuid"
      required:
        - "question"
      additionalProperties: false
    Ratio:
      type: "string"
      description: "Percentage or ratio as a decimal string with up to 4 decimals."
      pattern: "^-?\\d+(\\.\\d{1,4})?$"
      examples:
        - "3.4865"
    RegisterRequest:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 80
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          minLength: 8
          description: "At least 8 chars with a letter and a digit, not in the breached list (PASSWORD_WEAK)."
        password_confirmation:
          type: "string"
        accept_terms:
          type: "boolean"
          const: true
      required:
        - "name"
        - "email"
        - "password"
        - "password_confirmation"
        - "accept_terms"
      additionalProperties: false
    ResetPasswordRequest:
      type: "object"
      properties:
        token:
          type: "string"
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          minLength: 8
        password_confirmation:
          type: "string"
      required:
        - "token"
        - "email"
        - "password"
        - "password_confirmation"
      additionalProperties: false
    RiskProfile:
      type: "object"
      properties:
        version:
          oneOf:
            - type: "integer"
              minimum: 1
