              description: "ISO-8601 timestamp with offset."
            exit_at:
              oneOf:
                - type: "string"
                  format: "date-time"
                  description: "ISO-8601 timestamp with offset."
                - type: "null"
            entry_price:
              "$ref": "#/components/schemas/Price"
            exit_price:
              oneOf:
                - "$ref": "#/components/schemas/Price"
                - type: "null"
            quantity:
              type: "integer"
            net_pnl:
              oneOf:
                - "$ref": "#/components/schemas/Money"
                - type: "null"
            r_multiple:
              oneOf:
                - "$ref": "#/components/schemas/Ratio"
                - type: "null"
            outcome:
              oneOf:
                - type: "string"
                  enum:
                    - "WIN"
                    - "LOSS"
                    - "BREAKEVEN"
                - type: "null"
          required:
            - "symbol"
            - "setup_type"
            - "direction"
            - "entry_at"
            - "exit_at"
            - "entry_price"
            - "exit_price"
            - "quantity"
            - "net_pnl"
            - "r_multiple"
            - "outcome"
          additionalProperties: false
        followed_plan:
          oneOf:
            - type: "boolean"
            - type: "null"
        followed_plan_system:
          oneOf:
            - type: "boolean"
              description: "Whether the system judged the plan to have been followed."
            - type: "null"
        notes:
          oneOf:
            - type: "string"
            - type: "null"
        tags:
          type: "array"
          items:
            type: "string"
            maxLength: 40
          maxItems: 20
        emotions:
          type: "array"
          items:
            type: "string"
        mistakes:
          type: "array"
          items:
            type: "string"
        lessons:
          oneOf:
            - type: "string"
            - type: "null"
        rating:
          oneOf:
            - type: "integer"
              minimum: 1
              maximum: 5
            - type: "null"
      required:
        - "id"
        - "kind"
        - "status"
        - "trade"
        - "followed_plan"
        - "followed_plan_system"
        - "notes"
        - "tags"
        - "emotions"
        - "mistakes"
        - "lessons"
        - "rating"
      additionalProperties: false
    JournalPatch:
      type: "object"
      properties:
        notes:
          type: "string"
        tags:
          type: "array"
          items:
            type: "string"
            maxLength: 40
          maxItems: 20
        emotions:
          type: "array"
          items:
            type: "string"
        mistakes:
          type: "array"
          items:
            type: "string"
        lessons:
          type: "string"
        rating:
          type: "integer"
          minimum: 1
          maximum: 5
        followed_plan:
          type: "boolean"
        status:
          type: "string"
          enum:
            - "DRAFT"
            - "COMPLETE"
      additionalProperties: false
    JournalStats:
      type: "object"
      properties:
        trades:
          type: "integer"
        win_rate:
          "$ref": "#/components/schemas/Ratio"
        profit_factor:
          oneOf:
            - "$ref": "#/components/schemas/Ratio"
            - type: "null"
        avg_r:
          "$ref": "#/components/schemas/Ratio"
        net_pnl:
          "$ref": "#/components/schemas/Money"
        plan_adherence_pct:
          "$ref": "#/components/schemas/Ratio"
      required:
        - "trades"
        - "win_rate"
        - "profit_factor"
        - "avg_r"
        - "net_pnl"
        - "plan_adherence_pct"
      additionalProperties: false
    LiquidityEvent:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        type:
          type: "string"
          enum:
            - "EQUAL_HIGHS"
            - "EQUAL_LOWS"
            - "SWEEP_HIGH"
            - "SWEEP_LOW"
        level:
          "$ref": "#/components/schemas/Price"
        first_bar_start:
          type: "string"
          format: "date-time"
          description: "ISO-8601 timestamp with offset."
        last_bar_start:
          type: "string"
          format: "date-time"
          description: "ISO-8601 timestamp with offset."
      required:
        - "id"
        - "type"
        - "level"
        - "first_bar_start"
        - "last_bar_start"
      additionalProperties: false
    LivePosition:
      type: "object"
      properties:
        position_id:
          type: "string"
          format: "uuid"
        symbol:
          type: "string"
        quantity:
          type: "integer"
          minimum: 1
        entry_price:
          "$ref": "#/components/schemas/Price"
        entry_at:
          type: "string"
          format: "date-time"
          description: "ISO-8601 timestamp with offset."
        current_price:
          oneOf:
            - "$ref": "#/components/schemas/Price"
            - type: "null"
        price_at:
          oneOf:
            - type: "string"
              description: "Time of the current price (from the current-price cache)."
              format: "date-time"
            - type: "null"
        unrealised_pnl:
          oneOf:
            - "$ref": "#/components/schemas/Money"
            - type: "null"
        stop:
          oneOf:
            - "$ref": "#/components/schemas/Price"
            - type: "null"
          description: "The linked plan's stop; null for a trade logged without a plan."
        target:
          oneOf:
            - "$ref": "#/components/schemas/Price"
            - type: "null"
          description: "The linked plan's target; null for a trade logged without a plan."
        distance_to_stop_pct:
          oneOf:
            - "$ref": "#/components/schemas/Ratio"
            - type: "null"
        distance_to_target_pct:
          oneOf:
            - "$ref": "#/components/schemas/Ratio"
            - type: "null"
        signal:
          oneOf:
            - type: "string"
              enum:
                - "HOLD"
                - "EXIT"
            - type: "null"
          description: "Null until the engine evaluates open positions (not built); never guessed by the API."
      required:
        - "position_id"
        - "symbol"
        - "quantity"
        - "entry_price"
        - "entry_at"
        - "current_price"
        - "price_at"
        - "unrealised_pnl"
        - "stop"
        - "target"
        - "distance_to_stop_pct"
        - "distance_to_target_pct"
        - "signal"
      description: "Current prices are display-only and never change analysis (ENG-05 §12)."
      additionalProperties: false
    LoginRequest:
      type: "object"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
        remember:
          type: "boolean"
      required:
        - "email"
        - "password"
      additionalProperties: false
    MarketIndexQuote:
      type: "object"
      properties:
        symbol:
          type: "string"
        name:
          type: "string"
        value:
          "$ref": "#/components/schemas/Price"
        change:
          "$ref": "#/components/schemas/Money"
        change_pct:
          "$ref": "#/components/schemas/Ratio"
        trend:
          type: "array"
          items:
            "$ref": "#/components/schemas/Price"
          description: "Last 30 closes."
      required:
        - "symbol"
        - "name"
        - "value"
        - "change"
        - "change_pct"
        - "trend"
      additionalProperties: false
    MarketMeta:
      description: "Meta for any response that contains market data or analysis: data_mode and as_of are mandatory (constraint C-03)."
      allOf:
        - "$ref": "#/components/schemas/Meta"
        - type: "object"
          required:
            - "request_id"
            - "data_mode"
            - "as_of"
    MarketSession:
      type: "object"
      properties:
        exchange:
          type: "string"
          enum:
            - "NSE"
        state:
          type: "string"
          enum:
            - "PRE_OPEN"
            - "OPEN"
            - "CLOSED"
        is_trading_day:
          type: "boolean"
        session_open:
          oneOf:
            - type: "string"
              format: "date-time"
              description: "ISO-8601 timestamp with offset."
            - type: "null"
        session_close:
          oneOf:
            - type: "string"
              format: "date-time"
              description: "ISO-8601 timestamp with offset."
            - type: "null"
        entry_cutoff_at:
          oneOf:
            - type: "string"
              format: "date-time"
              description: "ISO-8601 timestamp with offset."
            - type: "null"
        session_end_exit_at:
          oneOf:
            - type: "string"
              format: "date-time"
              description: "ISO-8601 timestamp with offset."
            - type: "null"
        next_open:
          type: "string"
          format: "date-time"
          description: "ISO-8601 timestamp with offset."
        last_trading_day:
          type: "string"
          format: "date"
          description: "Exchange date, YYYY-MM-DD."
        last_bar_close:
          oneOf:
            - type: "string"
              format: "date-time"
              description: "ISO-8601 timestamp with offset."
            - type: "null"
        calendar_verified:
          type: "boolean"
          description: "False while the NSE holiday list is not loaded (ARC-03 §2.2)."
      required:
        - "exchange"
        - "state"
        - "is_trading_day"
        - "session_open"
        - "session_close"
        - "entry_cutoff_at"
        - "session_end_exit_at"
        - "next_open"
        - "last_trading_day"
        - "last_bar_close"
        - "calendar_verified"
      additionalProperties: false
    Me:
      type: "object"
      properties:
        user:
          "$ref": "#/components/schemas/UserSummary"
        tenant:
          "$ref": "#/components/schemas/TenantSummary"
        entitlement:
          "$ref": "#/components/schemas/Entitlement"
        onboarding:
          "$ref": "#/components/schemas/OnboardingSummary"
        data_source:
          "$ref": "#/components/schemas/DataSourceSummary"
      required:
        - "user"
      description: "Personal mode (ADR-014, ADR-016) returns only `user`; tenant, entitlement, onboarding and data_source are deferred and omitted."
      additionalProperties: false
    Meta:
      type: "object"
      properties:
        request_id:
          type: "string"
          description: "Request id echoed in the X-Request-Id header and in error bodies."
        data_mode:
          "$ref": "#/components/schemas/DataMode"
        as_of:
          type: "string"
          format: "date-time"
          description: "End of the last completed bar used (ISO-8601, +05:30)."
        next_bar_close:
          oneOf:
            - type: "string"
              format: "date-time"
              description: "When the data can next change (end of the next 5m bar)."
            - type: "null"
        next_cursor:
          oneOf:
            - type: "string"
              description: "Opaque cursor for the next page; null at the end."
            - type: "null"
      required:
        - "request_id"
      description: "Response metadata. Endpoint-specific keys (totals, batch, unread_count) are allowed."
      additionalProperties: true
    Money:
      type: "string"
      description: "Signed money amount as a decimal string with 2 decimals."
      pattern: "^-?\\d+\\.\\d{2}$"
      examples:
        - "12345.67"
    Notification:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        type:
          type: "string"
        title:
          type: "string"
        body:
          type: "string"
        entity:
          type: "object"
          description: "Reference to the related entity."
          additionalProperties: true
        read:
          type: "boolean"
        created_at:
          type: "string"
          format: "date-time"
          description: "ISO-8601 timestamp with offset."
      required:
        - "id"
        - "type"
        - "title"
        - "body"
        - "entity"
        - "read"
        - "created_at"
      additionalProperties: false
    OnboardingState:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            - "NOT_STARTED"
            - "IN_PROGRESS"
            - "COMPLETED"
        flow_version:
          type: "integer"
        current_step:
          oneOf:
            - type: "string"
            - type: "null"
        completed_steps:
          type: "array"
          items:
            type: "string"
        skipped_steps:
          type: "array"
          items:
            type: "string"
        steps:
          type: "array"
          items:
            type: "object"
            properties:
              id:
                type: "string"
              optional:
                type: "boolean"
              completed:
                type: "boolean"
              skipped:
                type: "boolean"
            required:
              - "id"
              - "optional"
              - "completed"
              - "skipped"
            additionalProperties: false
      required:
        - "status"
        - "flow_version"
        - "current_step"
        - "completed_steps"
        - "skipped_steps"
        - "steps"
      additionalProperties: false
    OnboardingStepPayload:
      description: "Payload depends on {step}: welcome {}; experience {experience_level}; style {trading_styles 1-4}; universe {universe_code}; data_source {mode DEMO} or {mode PERSONAL, provider ZERODHA_KITE}; risk {trading_capital, risk_per_trade_pct, max_open_positions}."
      oneOf:
        - type: "object"
          properties: {}
          additionalProperties: false
        - type: "object"
          properties:
            experience_level:
              "$ref": "#/components/schemas/ExperienceLevel"
          required:
            - "experience_level"
          additionalProperties: false
        - type: "object"
          properties:
            trading_styles:
              type: "array"
              items:
                "$ref": "#/components/schemas/TradingStyle"
              minItems: 1
              maxItems: 4
              uniqueItems: true
          required:
            - "trading_styles"
          additionalProperties: false
        - type: "object"
          properties:
            universe_code:
              "$ref": "#/components/schemas/UniverseCode"
          required:
            - "universe_code"
          additionalProperties: false
        - type: "object"
          properties:
            mode:
              type: "string"
              enum:
                - "DEMO"
          required:
            - "mode"
          additionalProperties: false
        - type: "object"
          properties:
            mode:
              type: "string"
              enum:
                - "PERSONAL"
            provider:
              type: "string"
              enum:
                - "ZERODHA_KITE"
          required:
            - "mode"
            - "provider"
          additionalProperties: false
        - type: "object"
          properties:
            trading_capital:
              "$ref": "#/components/schemas/Money"
            risk_per_trade_pct:
              "$ref": "#/components/schemas/Ratio"
            max_open_positions:
              type: "integer"
              minimum: 1
          required:
            - "trading_capital"
            - "risk_per_trade_pct"
            - "max_open_positions"
          additionalProperties: false
    OnboardingSummary:
