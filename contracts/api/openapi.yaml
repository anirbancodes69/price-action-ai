          maximum: 100
      required:
        - "type"
        - "direction"
        - "status"
        - "levels"
        - "quality_score"
      additionalProperties: false
    ProfilePatch:
      type: "object"
      properties:
        display_name:
          type: "string"
          minLength: 1
          maxLength: 80
        experience_level:
          "$ref": "#/components/schemas/ExperienceLevel"
        timezone:
          type: "string"
      additionalProperties: false
    QuestionRequest:
      type: "object"
