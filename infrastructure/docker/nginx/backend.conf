# Nginx in front of Laravel PHP-FPM (docs/architecture/01_SYSTEM_ARCHITECTURE.md §3).
server {
    listen 8000;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 2m;
    server_tokens off;

    # Resolve the backend through Docker DNS at request time so recreated containers (deploys,
    # dev restarts) are picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream backend:9000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Internal endpoints (/internal/v1/*) are for the engine on the private network only.
    # They are served on this listener but Laravel additionally enforces the service token.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
