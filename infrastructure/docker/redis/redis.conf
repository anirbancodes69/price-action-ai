# Redis: cache, queues, sessions, rate limits — no data of record (ADR-006).
# AOF everysec so queued jobs survive restarts (docs/operations/04_DATA_RETENTION_AND_BACKUP.md §2).
appendonly yes
appendfsync everysec
save ""
maxmemory-policy noeviction
protected-mode yes
# Password is supplied at runtime via --requirepass from the REDIS_PASSWORD env var.
