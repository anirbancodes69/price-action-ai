# Grouped weekly updates per ecosystem (docs/architecture/02_TECHNOLOGY_STACK.md §4).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups:
      frontend-minor-patch: { update-types: [minor, patch] }
    ignore:
      # Runtime is Node 26; keep type definitions aligned with it.
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
      # Not supported by the Next.js 16 toolchain yet; revisit deliberately, not via bot.
      - { dependency-name: "typescript", update-types: ["version-update:semver-major"] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: composer
    directory: /backend
    schedule: { interval: weekly, day: monday }
    groups:
      backend-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: uv
    directory: /python-engine
    schedule: { interval: weekly, day: monday }
    groups:
      engine-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: docker
    directories: [/frontend, /backend, /python-engine]
    schedule: { interval: weekly, day: monday }
    ignore:
      # Runtime pins are architectural (ARC-02): PHP 8.4 (composer platform pin), Python 3.13 (requires-python).
      # Bump these together with composer.json / pyproject.toml in a dedicated PR.
      - { dependency-name: "php", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
      - { dependency-name: "python", update-types: ["version-update:semver-major", "version-update:semver-minor"] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "chore(deps)" }
