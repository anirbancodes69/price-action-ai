# Coordinator: detects changed areas, runs only the relevant component workflows, and ends with a
# single required status check `ci-gate` (docs/engineering/10_GITHUB_ACTIONS_CI_CD.md §2.1).
name: ci

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the pipeline when a PR title is changed, so a corrected title does not need a close/reopen.
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      engine: ${{ steps.filter.outputs.engine }}
      docker: ${{ steps.filter.outputs.docker }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Pushes to main and manual runs execute every component regardless of these filters.
          filters: |
            shared: &shared
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            contracts:
              - *shared
              - 'docs/architecture/04_API_SPECIFICATION.md'
              - '.github/workflows/contracts-ci.yml'
            frontend:
              - *shared
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'
            backend:
              - *shared
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'
            engine:
              - *shared
              - 'python-engine/**'
              - 'docs/trading/**'
              - '.github/workflows/python-engine-ci.yml'
            docker:
              - *shared
              - 'frontend/**'
              - 'backend/**'
              - 'python-engine/**'
              - 'infrastructure/**'
              - 'docker-compose*.yml'
              - '.env.example'
              - 'scripts/setup-env.sh'
              - '.github/workflows/docker-build.yml'

  semantic-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # Squash merges use the PR title as the commit message, so it must be `type(scope): summary`.
      # GitHub defaults a multi-commit PR's title to the branch name, which always fails. When that
      # happens, replace it with the newest conforming commit subject (preferring feat/fix), then validate.
      # Types and scopes mirror CLAUDE.md §6; keep them in sync.
      - name: Validate the title (auto-fix a branch-name default)
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|docs|chore|refactor|test|ci|build|perf)\((frontend|backend|engine|contracts|infra|docs|ruleset|deps)\): .+'
          title="$(gh pr view "$PR" --repo "$REPO" --json title --jq .title)"
          if [[ ! "$title" =~ $PATTERN ]]; then
            subjects="$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].commit.message | split("\n")[0]' | tac)"
            pick="$(grep -E '^(feat|fix)\(' <<<"$subjects" | grep -E "$PATTERN" | head -n1 || true)"
            [ -n "$pick" ] || pick="$(grep -E "$PATTERN" <<<"$subjects" | head -n1 || true)"
            if [ -n "$pick" ]; then
              echo "::notice::PR title '$title' is not a Conventional Commit; replacing it with '$pick'."
              gh pr edit "$PR" --repo "$REPO" --title "$pick"
              title="$pick"
            fi
          fi
          if [[ ! "$title" =~ $PATTERN ]]; then
            echo "::error::PR title '$title' must look like 'type(scope): summary'. Types: feat fix docs chore refactor test ci build perf. Scopes: frontend backend engine contracts infra docs ruleset deps."
            exit 1
          fi
          echo "PR title OK: $title"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/frontend-ci.yml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/backend-ci.yml

  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/python-engine-ci.yml

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/docker-build.yml

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/contracts-ci.yml

  security:
    uses: ./.github/workflows/security-scan.yml

  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, semantic-title, frontend, backend, engine, docker, contracts, security]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
