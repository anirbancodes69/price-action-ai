# Compose validation, image builds and a full-stack smoke test (docs/engineering/10_GITHUB_ACTIONS_CI_CD.md §4.5).
# Phase 1: build only (no push). Image publishing to GHCR is added in Phase 2.
name: docker-build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: compose validate · build · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Ephemeral environment (random secrets, never stored)
        run: ./scripts/setup-env.sh

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev config -q

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build images
        run: docker compose build

      - name: Start stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 240

      - name: Smoke tests
        run: |
          set -eu
          curl -fsS http://localhost:3000/login -o /dev/null
          curl -fsS http://localhost:8000/api/health
          # Deep check: backend -> PostgreSQL, Redis and engine (authenticated ping)
          curl -fsS 'http://localhost:8000/api/health?deep=1' | tee /tmp/deep.json
          jq -e '.checks.database and .checks.redis and .checks.engine' /tmp/deep.json
          # The engine must not be reachable from the host
          if curl -fsS -m 3 http://localhost:8100/health; then echo "::error::engine is exposed"; exit 1; fi

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
