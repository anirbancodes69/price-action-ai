name: Bug
description: Something behaves differently from the specification
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Include request_id if shown." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behaviour, description: "Link the spec section (e.g. TRD-05 §7)." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [frontend, backend, engine, infra, docs]
    validations: { required: true }
